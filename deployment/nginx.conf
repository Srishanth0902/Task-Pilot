server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
