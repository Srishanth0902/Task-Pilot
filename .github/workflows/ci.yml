name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taskpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://taskpilot:test-only-password@127.0.0.1:5432/taskpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m app.evaluation
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - run: docker build --file Dockerfile.api --tag task-pilot-api:ci .
      - run: docker build --file Dockerfile.web --tag task-pilot-web:ci .
      - run: docker build --file Dockerfile.render --tag task-pilot-render:ci .
      - run: python scripts/verify_deployment.py --image task-pilot-render:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-report
          path: .worker-results/deployment-smoke.json
          if-no-files-found: ignore
